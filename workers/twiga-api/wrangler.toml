name = "twiga-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "twiga-db"
database_id = "77f5a69f-a2e7-4de6-a164-8e98beaedfd8"

[ai]
binding = "AI"


[[durable_objects.bindings]]
name = "BUSINESS_AGENT"
class_name = "BusinessAgent"

[[durable_objects.bindings]]
name = "WAHA_CONTAINER"
class_name = "WahaContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BusinessAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WahaContainer"]

[[containers]]
class_name = "WahaContainer"
image = "./waha/Dockerfile"
image_build_context = "./waha"
instance_type = "basic"
max_instances = 10

[triggers]
crons = ["* * * * *"]

[vars]
META_GRAPH_VERSION = "v27.0"
R2_ACCOUNT_ID = "1cc614c3da5df801f742a023ae1ffc95"
WAHA_WEBHOOK_URL = "https://twiga-api.twiga-ke.workers.dev/whatsapp/waha-webhook"
