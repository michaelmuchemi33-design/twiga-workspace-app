name = "twiga-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "twiga-db"
database_id = "77f5a69f-a2e7-4de6-a164-8e98beaedfd8"

[ai]
binding = "AI"


[[durable_objects.bindings]]
name = "BUSINESS_AGENT"
class_name = "BusinessAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BusinessAgent"]

[triggers]
crons = ["* * * * *"]

[vars]
META_GRAPH_VERSION = "v27.0"
