name: Build TWIGA Android APK
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish public beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-beta-2026-11-14" "android/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TWIGA Android Beta — 14 November 2026" \
            --notes "Public beta test build. This APK is debug-signed for testing and is not the production-signed release. A production update must use the final TWIGA signing key." \
            --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: twiga-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
