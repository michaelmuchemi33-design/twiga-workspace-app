name: Deploy voice-test-1-ai Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/voice-test-1-ai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1cc614c3da5df801f742a023ae1ffc95
          workingDirectory: workers/voice-test-1-ai
          command: deploy
